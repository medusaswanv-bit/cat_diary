  <!-- Auto-Generate High-Res 512x512 PNG Cat App Icon & PWA Manifest for iOS/Android Home Screen -->
  <script>
    (function () {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        var ctx = canvas.getContext('2d');

        // Warm amber-orange rounded background
        var grad = ctx.createLinearGradient(0, 0, 512, 512);
        grad.addColorStop(0, '#fbbf24');
        grad.addColorStop(1, '#ea580c');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(0, 0, 512, 512, 115);
        ctx.fill();

        // Soft inner cream circle
        ctx.fillStyle = '#fffbeb';
        ctx.beginPath();
        ctx.arc(256, 256, 200, 0, Math.PI * 2);
        ctx.fill();

        // Cute Cat Face Emoji centered
        ctx.font = '260px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🐱', 256, 272);

        var pngDataUrl = canvas.toDataURL('image/png');

        var appleLink = document.getElementById('apple-touch-icon-link');
        if (appleLink) appleLink.href = pngDataUrl;

        var favLink = document.getElementById('favicon-link');
        if (favLink) favLink.href = pngDataUrl;

        // Inject dynamic Web App Manifest so Android Chrome installs it as "貓貓日記"
        var manifest = {
          name: '貓貓日記',
          short_name: '貓貓日記',
          description: '兩隻貓貓嘅全方位生活與健康記錄',
          start_url: './',
          display: 'standalone',
          background_color: '#fffbeb',
          theme_color: '#fffbeb',
          icons: [
            { src: pngDataUrl, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
          ]
        };
        var manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        var manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);
      } catch (e) {}
    })();
  </script>

      const d = new Date();
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;

    const daysAgoStr = (days) => {

      d.setDate(d.getDate() - days);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    };

    const calcDaysBetween = (dateStr) => {
      if (!dateStr) return null;
      const parts = dateStr.split('-');
      if (parts.length !== 3) return null;
      const target = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diff = Math.floor((today - target) / (1000 * 60 * 60 * 24));
      return diff >= 0 ? diff : 0;
    };

    // --- 自動計算貓貓年齡 (精確至歲及月) ---
    const calcCatAge = (birthdayStr) => {
      if (!birthdayStr) return '未設定生日';
      const parts = birthdayStr.split('-');
      if (parts.length !== 3) return '未設定生日';
      const birth = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      if (isNaN(birth.getTime())) return '未設定生日';

      const now = new Date();
      let years = now.getFullYear() - birth.getFullYear();
      let months = now.getMonth() - birth.getMonth();
      const days = now.getDate() - birth.getDate();

      if (days < 0) {
        months -= 1;
      }
      if (months < 0) {
        years -= 1;
        months += 12;
      }

      if (years < 0) return '即將出生';
      if (years === 0 && months === 0) {
        const diffDays = Math.max(1, Math.floor((now - birth) / (1000 * 60 * 60 * 24)));
        return `${diffDays}日大`;
      }
      if (years === 0) return `${months}個月大`;
      if (months === 0) return `${years}歲`;
      return `${years}歲${months}個月`;
    };

        };
      };

        try {
          const payload = createBackupPayload();
          const jsonStr = JSON.stringify(payload, null, 2);
          const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `貓貓日記_備份_${getTodayStr()}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('📥 備份檔已下載到你部機！');
        } catch (err) {
          showToast('⚠️ 下載失敗，請使用下方「複製備份文字」功能');
        }
      };

      const handleCopyBackupText = () => {
        try {
          const payload = createBackupPayload();
          const jsonStr = JSON.stringify(payload);
          navigator.clipboard.writeText(jsonStr);
          showToast('📋 已複製備份文字！可以貼去 Notes 或自己 WhatsApp 留底');
        } catch (err) {
          showToast('⚠️ 複製失敗，請手動複製');
        }
      };

      const validateAndPreviewImport = (rawText) => {
        setImportError('');
        setImportPreview(null);
        if (!rawText || !rawText.trim()) return;
        try {
          const parsed = JSON.parse(rawText);
          const d = parsed.data ? parsed.data : parsed;
          if (!d.cats || !Array.isArray(d.logs) || !Array.isArray(d.cans) || !Array.isArray(d.weights)) {
            setImportError('檔案格式唔啱：缺少必要嘅貓貓資料欄位，請確認係咪由本 App 匯出嘅備份檔。');
            return;

            exportedAt: parsed.exportDate || '未知日期',
            catNames: `${d.cats.cat1?.name || '貓1'} & ${d.cats.cat2?.name || '貓2'}`,
            logsCount: d.logs.length,
            cansCount: d.cans.length,
            weightsCount: d.weights.length,
            payloadData: d
          });
        } catch (err) {
          setImportError('無法解析 JSON 內容，請確認檔案冇損壞或文字已經完整貼上。');
        }

            validateAndPreviewImport(content);

        reader.readAsText(file);

    function WeightsView({ cats, weights, setWeights, selectedCatFilter, showToast }) {
      const [catId, setCatId] = useState(selectedCatFilter === 'cat2' ? 'cat2' : 'cat1');
      const [date, setDate] = useState(getTodayStr());
      const [weightVal, setWeightVal] = useState('');
      const [bcs, setBcs] = useState('normal');
      const [method, setMethod] = useState('hold');
      const [note, setNote] = useState('');

      const [showCalc, setShowCalc] = useState(false);
      const [holdTotal, setHoldTotal] = useState('');
      const [humanOnly, setHumanOnly] = useState('');

      useEffect(() => {
        if (selectedCatFilter === 'cat1' || selectedCatFilter === 'cat2') {
          setCatId(selectedCatFilter);
        }
      }, [selectedCatFilter]);

      useEffect(() => {
        const t = parseFloat(holdTotal);
        const h = parseFloat(humanOnly);
        if (!isNaN(t) && !isNaN(h) && t > h) {
          setWeightVal((t - h).toFixed(2));
        }
      }, [holdTotal, humanOnly]);

      const handleAddWeight = (e) => {
        e.preventDefault();
        const num = parseFloat(weightVal);
        if (isNaN(num) || num <= 0 || num > 25) {
          showToast('⚠️ 請輸入有效嘅貓貓體重 (kg)');
          return;
        }
        const newEntry = {
          id: 'w-' + Date.now(),
          catId,
          date,
          weight: Number(num.toFixed(2)),
          bcs,
          method,
          note: note.trim()
        };
        setWeights(prev => [...prev, newEntry]);
        setWeightVal('');
        setNote('');
        setHoldTotal('');
        setHumanOnly('');
        setShowCalc(false);
        showToast(`⚖️ 已記錄 ${cats[catId]?.name} 體重：${num.toFixed(2)} kg`);
      };

      const deleteWeight = (id) => {
        setWeights(prev => prev.filter(w => w.id !== id));
        showToast('🗑️ 已刪除體重紀錄');
      };

      const cat1Series = useMemo(
        () => weights.filter(w => w.catId === 'cat1').sort((a, b) => a.date.localeCompare(b.date)),
        [weights]
      );
      const cat2Series = useMemo(
        () => weights.filter(w => w.catId === 'cat2').sort((a, b) => a.date.localeCompare(b.date)),
        [weights]
      );

      const getWeightStats = (series) => {
        if (series.length === 0) return { latest: null, diff: null, min: null, max: null };
        const latest = series[series.length - 1];
        const prev = series.length >= 2 ? series[series.length - 2] : null;
        const diff = prev ? Number((latest.weight - prev.weight).toFixed(2)) : null;
        const vals = series.map(s => s.weight);
        return {
          latest,
          diff,
          min: Math.min(...vals),
          max: Math.max(...vals)
        };
      };

      const stats1 = getWeightStats(cat1Series);
      const stats2 = getWeightStats(cat2Series);

      return (
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-3">
            {[
              { id: 'cat1', stats: stats1 },
              { id: 'cat2', stats: stats2 }
            ].map(({ id, stats }) => {
              const cat = cats[id];
              const theme = COLOR_THEMES[cat.color] || COLOR_THEMES.slate;
              return (
                <div key={id} className={`rounded-2xl p-3.5 border ${theme.bgCard} ${theme.border} shadow-sm`}>
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-extrabold text-stone-700 flex items-center gap-1">
                      <span>{cat.avatar}</span> {cat.name}
                    </span>
                    {stats.diff !== null && (
                      <span
                        className={`text-[10px] font-bold px-1.5 py-0.5 rounded-full ${
                          stats.diff > 0

    function WeightLineChart({ cat1Series, cat2Series }) {
      const allPoints = [...cat1Series, ...cat2Series];
      if (allPoints.length === 0) {
        return <div className="text-xs text-stone-400 text-center py-8">暫無體重數據</div>;
      }

      const allDates = Array.from(new Set(allPoints.map(p => p.date))).sort();
      const allWeights = allPoints.map(p => p.weight);
      const minW = Math.max(0, Math.floor((Math.min(...allWeights) - 0.3) * 10) / 10);
      const maxW = Math.ceil((Math.max(...allWeights) + 0.3) * 10) / 10;
      const rangeW = Math.max(0.5, maxW - minW);

      const width = 460;
      const height = 170;
      const padLeft = 38;
      const padRight = 20;
      const padTop = 18;
      const padBottom = 28;
      const plotW = width - padLeft - padRight;
      const plotH = height - padTop - padBottom;

      const getX = (dateStr) => {
        if (allDates.length === 1) return padLeft + plotW / 2;
        const idx = allDates.indexOf(dateStr);
        return padLeft + (idx / (allDates.length - 1)) * plotW;
      };

      const getY = (val) => {
        return padTop + plotH - ((val - minW) / rangeW) * plotH;
      };

      const buildPoints = (series) => series.map(item => `${getX(item.date)},${getY(item.weight)}`).join(' ');

      return (
        <div className="w-full overflow-x-auto">
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-44 overflow-visible">
            {[0, 0.5, 1].map((ratio, idx) => {
              const y = padTop + ratio * plotH;
              const val = (maxW - ratio * rangeW).toFixed(1);
              return (
                <g key={idx}>
                  <line x1={padLeft} y1={y} x2={width - padRight} y2={y} stroke="#e7e5e4" strokeDasharray="3 3" />
                  <text x={padLeft - 6} y={y + 4} textAnchor="end" fontSize="10" fill="#78716c">
                    {val}kg
                  </text>
                </g>
              );
            })}

            {cat1Series.length > 1 && (
              <polyline
                fill="none"
                stroke="#475569"
                strokeWidth="2.5"
                strokeLinecap="round"
                strokeLinejoin="round"
                points={buildPoints(cat1Series)}
              />
            )}

            {cat2Series.length > 1 && (
              <polyline
                fill="none"
                stroke="#d97706"
                strokeWidth="2.5"
                strokeLinecap="round"
                strokeLinejoin="round"
                points={buildPoints(cat2Series)}
              />
            )}

            {cat1Series.map(pt => (
              <g key={pt.id}>
                <circle cx={getX(pt.date)} cy={getY(pt.weight)} r="4" fill="#475569" stroke="#fff" strokeWidth="1.5" />
                <text x={getX(pt.date)} y={getY(pt.weight) - 7} textAnchor="middle" fontSize="9" fontWeight="bold" fill="#334155">
                  {pt.weight}
                </text>
              </g>
            ))}

            {cat2Series.map(pt => (
              <g key={pt.id}>
                <circle cx={getX(pt.date)} cy={getY(pt.weight)} r="4" fill="#d97706" stroke="#fff" strokeWidth="1.5" />
                <text x={getX(pt.date)} y={getY(pt.weight) - 7} textAnchor="middle" fontSize="9" fontWeight="bold" fill="#b45309">
                  {pt.weight}
                </text>
              </g>
            ))}

            {allDates.map((d) => (
              <text key={d} x={getX(d)} y={height - 6} textAnchor="middle" fontSize="9" fill="#78716c">
                {d.slice(5)}
              </text>
            ))}
          </svg>
        </div>
      );
    }

    function CansView({ cats, cans, setCans, searchQuery, showToast }) {

      const [cat2Rating, setCat2Rating] = useState('good');
      const [note, setNote] = useState('');
      const [showForm, setShowForm] = useState(false);

      const handleAddCan = (e) => {
        e.preventDefault();
        if (!brand.trim() || !flavor.trim()) return;
        const newCan = {
          id: 'can-' + Date.now(),
          brand: brand.trim(),
          flavor: flavor.trim(),
          texture,
          cat1Rating,
          cat2Rating,
          note: note.trim()
        };
        setCans(prev => [newCan, ...prev]);
        setBrand('');
        setFlavor('');
        setNote('');
        setShowForm(false);
        showToast(`🥫 已加入主食罐：${newCan.brand} - ${newCan.flavor}`);
      };

      const cycleRating = (canId, catKey) => {
        const order = ['love', 'good', 'meh', 'hate'];
        setCans(prev =>
          prev.map(c => {
            if (c.id !== canId) return c;
            const current = c[catKey] || 'good';
            const next = order[(order.indexOf(current) + 1) % order.length];
            return { ...c, [catKey]: next };
          })
        );
      };

      const deleteCan = (id) => {
        setCans(prev => prev.filter(c => c.id !== id));
        showToast('🗑️ 已刪除該款罐罐');
      };

      const filteredCans = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        return cans.filter(c => {
          if (q) {
            const matchText =
              c.brand.toLowerCase().includes(q) ||
              c.flavor.toLowerCase().includes(q) ||
              (c.note && c.note.toLowerCase().includes(q));
            if (!matchText) return false;
          }
          if (filterMode === 'both_love') {
            return RATING_MAP[c.cat1Rating]?.score >= 3 && RATING_MAP[c.cat2Rating]?.score >= 3;
          }
          if (filterMode === 'cat1_love') {
            return RATING_MAP[c.cat1Rating]?.score >= 3;
          }
          if (filterMode === 'cat2_love') {
            return RATING_MAP[c.cat2Rating]?.score >= 3;
          }
          if (filterMode === 'avoid') {
            return c.cat1Rating === 'hate' || c.cat2Rating === 'hate';
          }
          return true;
        });

      return (

              </div>
              <button

                { id: 'cat1_love', label: `${cats.cat1.avatar} ${cats.cat1.name}愛食` },

    function TimelineView({ cats, logs, selectedCatFilter, searchQuery, onDeleteLog, onMarkHealed, onGoToAdd }) {
      const [categoryFilter, setCategoryFilter] = useState('all');

          .filter(l => {
            if (selectedCatFilter !== 'all' && l.catId !== 'both' && l.catId !== selectedCatFilter) return false;
            if (categoryFilter !== 'all' && l.category !== categoryFilter) return false;
            if (!q) return true;
            return (
              (l.title && l.title.toLowerCase().includes(q)) ||
              (l.subType && l.subType.toLowerCase().includes(q)) ||
              (l.note && l.note.toLowerCase().includes(q)) ||
              (l.injuryArea && l.injuryArea.toLowerCase().includes(q))
            );
          })
          .sort((a, b) => `${b.date} ${b.time}`.localeCompare(`${a.date} ${a.time}`));
      }, [logs, selectedCatFilter, categoryFilter, searchQuery]);

      return (
        <div className="space-y-3">
          <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
            <button
              onClick={() => setCategoryFilter('all')}
              className={`px-3 py-1.5 rounded-full text-xs font-bold shrink-0 border ${
                categoryFilter === 'all' ? 'bg-stone-800 text-white border-stone-800' : 'bg-white text-stone-600 border-stone-200'
              }`}
            >
              全部 ({logs.length})
            </button>
            {Object.entries(CATEGORY_CONFIG).map(([key, cfg]) => (
              <button
                key={key}
                onClick={() => setCategoryFilter(key)}
                className={`px-3 py-1.5 rounded-full text-xs font-bold shrink-0 border flex items-center gap-1 ${
                  categoryFilter === key ? 'bg-stone-800 text-white border-stone-800' : 'bg-white text-stone-600 border-stone-200'
                }`}
              >
                <span>{cfg.icon}</span>
                <span>{cfg.label}</span>
              </button>
            ))}
          </div>

          {filteredLogs.length === 0 ? (
            <div className="bg-white rounded-2xl p-8 text-center border border-stone-200">
              <p className="text-sm font-bold text-stone-600 mb-2">暫時未有相關記錄</p>
              <button
                onClick={onGoToAdd}
                className="bg-amber-500 text-white text-xs font-bold px-4 py-2 rounded-full"
              >
                ＋ 立即新增第一筆記錄
              </button>
            </div>
          ) : (
            <div className="space-y-2.5">
              {filteredLogs.map(log => {
                const cfg = CATEGORY_CONFIG[log.category] || CATEGORY_CONFIG.food;
                const catLabel =
                  log.catId === 'both'
                    ? '🏠 兩隻一齊'
                    : `${cats[log.catId]?.avatar || '🐱'} ${cats[log.catId]?.name}`;

                return (
                  <div key={log.id} className="bg-white rounded-2xl p-3.5 border border-stone-200 shadow-sm">
                    <div className="flex items-start justify-between gap-2">
                      <div className="flex items-start gap-2.5">
                        <div className="w-9 h-9 rounded-xl bg-stone-100 flex items-center justify-center text-lg shrink-0">
                          {cfg.icon}
                        </div>
                        <div>
                          <div className="flex items-center gap-1.5 flex-wrap">
                            <span className="text-[11px] font-bold bg-stone-100 text-stone-700 px-2 py-0.5 rounded-md">
                              {catLabel}
                            </span>
                            <span className={`text-[11px] font-bold px-2 py-0.5 rounded-md border ${cfg.badgeClass}`}>
                              {log.subType}
                            </span>
                            {log.category === 'injury' && (
                              <span
                                className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                                  log.injuryStatus === 'healed'
                                    ? 'bg-emerald-100 text-emerald-800'
                                    : 'bg-rose-100 text-rose-800'
                                }`}
                              >
                                {log.injuryStatus === 'healed' ? '✨ 已康復' : '🩹 護理中'}
                              </span>
                            )}
                          </div>
                          <h4 className="text-sm font-extrabold text-stone-800 mt-1">{log.title}</h4>
                          {log.injuryArea && (
                            <div className="text-xs font-bold text-rose-700 mt-0.5">傷口位置：{log.injuryArea}</div>
                          )}
                          {log.note && <p className="text-xs text-stone-600 mt-1 leading-relaxed">{log.note}</p>}
                        </div>
                      </div>

                      <div className="text-right shrink-0 flex flex-col items-end gap-1">
                        <span className="text-[11px] font-bold text-stone-500">{log.date}</span>
                        <span className="text-[10px] text-stone-400">{log.time}</span>
                        <button
                          onClick={() => onDeleteLog(log.id)}
                          className="text-[11px] text-stone-300 hover:text-rose-600 mt-1"
                        >
                          刪除
                        </button>
                      </div>
                    </div>

                    {log.category === 'injury' && log.injuryStatus === 'recovering' && (
                      <div className="mt-2.5 pt-2 border-t border-stone-100 flex justify-end">
                        <button
                          onClick={() => onMarkHealed(log.id)}
                          className="text-xs font-bold bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-3 py-1 rounded-lg border border-emerald-200"
                        >
                          ✨ 標記傷口已康復
                        </button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    function AddLogView({ cats, selectedCatFilter, onAddLog }) {
      const [catId, setCatId] = useState(selectedCatFilter === 'all' ? 'cat1' : selectedCatFilter);
      const [category, setCategory] = useState('grooming');
      const [subType, setSubType] = useState(CATEGORY_CONFIG.grooming.subTypes[0]);
      const [title, setTitle] = useState('');
      const [date, setDate] = useState(getTodayStr());
      const [time, setTime] = useState(getNowTimeStr());
      const [injuryArea, setInjuryArea] = useState('');
      const [injuryStatus, setInjuryStatus] = useState('recovering');
      const [note, setNote] = useState('');

      const handleCategoryChange = (newCat) => {
        setCategory(newCat);
        const defaultSub = CATEGORY_CONFIG[newCat].subTypes[0];
        setSubType(defaultSub);
        if (newCat === 'litter') {
          setCatId('both');
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const finalTitle = title.trim() || subType;
        const newLog = {
          id: 'log-' + Date.now(),
          catId,
          category,
          subType,
          title: finalTitle,
          date,
          time,
          ...(category === 'injury' ? { injuryArea: injuryArea.trim(), injuryStatus } : {}),
          note: note.trim()
        };
        onAddLog(newLog);
      };

      return (
        <form onSubmit={handleSubmit} className="bg-white rounded-2xl p-4 border border-stone-200 shadow-sm space-y-4">
          <h2 className="text-base font-extrabold text-stone-800 flex items-center gap-2">
            <span>✍️</span> 新增貓貓生活 / 護理記錄
          </h2>

          <div>
            <label className="block text-xs font-bold text-stone-600 mb-1.5">1. 選擇主子</label>
            <div className="grid grid-cols-3 gap-2">
              {[
                { id: 'cat1', label: cats.cat1.name, icon: cats.cat1.avatar },
                { id: 'cat2', label: cats.cat2.name, icon: cats.cat2.avatar },
                { id: 'both', label: '兩隻一齊 / 共用', icon: '🏠' }
              ].map(opt => (
                <button
                  type="button"
                  key={opt.id}
                  onClick={() => setCatId(opt.id)}
                  className={`py-2.5 px-2 rounded-xl border text-xs font-bold flex items-center justify-center gap-1.5 transition ${
                    catId === opt.id
                      ? 'bg-stone-800 text-white border-stone-800 shadow-sm'
                      : 'bg-stone-50 text-stone-600 border-stone-200'
                  }`}
                >
                  <span>{opt.icon}</span>
                  <span className="truncate">{opt.label}</span>
                </button>
              ))}
            </div>
          </div>

          <div>
            <label className="block text-xs font-bold text-stone-600 mb-1.5">2. 記錄類別</label>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
              {Object.entries(CATEGORY_CONFIG).map(([key, cfg]) => (
                <button
                  type="button"
                  key={key}
                  onClick={() => handleCategoryChange(key)}
                  className={`py-2 px-3 rounded-xl border text-xs font-bold flex items-center gap-2 transition ${
                    category === key
                      ? 'bg-amber-100 border-amber-400 text-amber-950 ring-2 ring-amber-300'
                      : 'bg-stone-50 border-stone-200 text-stone-600'
                  }`}
                >
                  <span className="text-base">{cfg.icon}</span>
                  <span>{cfg.label}</span>
                </button>
              ))}
            </div>
          </div>

          <div>
            <label className="block text-xs font-bold text-stone-600 mb-1.5">3. 細項分類</label>
            <div className="flex flex-wrap gap-1.5">
              {CATEGORY_CONFIG[category].subTypes.map(st => (
                <button
                  type="button"
                  key={st}
                  onClick={() => setSubType(st)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition ${
                    subType === st
                      ? 'bg-stone-800 text-white border-stone-800'
                      : 'bg-stone-50 text-stone-600 border-stone-200'
                  }`}
                >
                  {st}
                </button>
              ))}
            </div>
          </div>

          {category === 'injury' && (
            <div className="p-3 rounded-xl bg-rose-50 border border-rose-200 space-y-3">
              <div>
                <label className="block text-xs font-bold text-rose-900 mb-1">傷口 / 患處位置</label>
                <input
                  type="text"
                  value={injuryArea}
                  onChange={e => setInjuryArea(e.target.value)}
                  placeholder="例如：左後腳、下巴、右耳背..."
                  className="w-full border border-rose-300 rounded-xl px-3 py-2 text-xs bg-white"
                />
              </div>
              <div>
                <label className="block text-xs font-bold text-rose-900 mb-1">目前狀態</label>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={() => setInjuryStatus('recovering')}
                    className={`py-1.5 rounded-xl text-xs font-bold border ${
                      injuryStatus === 'recovering'
                        ? 'bg-rose-600 text-white border-rose-600'
                        : 'bg-white text-stone-600 border-stone-200'
                    }`}
                  >
                    🩹 護理跟進中 (置頂提醒)
                  </button>
                  <button
                    type="button"
                    onClick={() => setInjuryStatus('healed')}
                    className={`py-1.5 rounded-xl text-xs font-bold border ${
                      injuryStatus === 'healed'
                        ? 'bg-emerald-600 text-white border-emerald-600'
                        : 'bg-white text-stone-600 border-stone-200'
                    }`}
                  >
                    ✨ 已完全康復
                  </button>
                </div>
              </div>
            </div>
          )}

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label className="block text-xs font-bold text-stone-600 mb-1">標題摘要 (選填)</label>
              <input
                type="text"
                value={title}
                onChange={e => setTitle(e.target.value)}
                placeholder={`預設：${subType}`}
                className="w-full border border-stone-300 rounded-xl px-3 py-2 text-xs"
              />
            </div>
            <div className="grid grid-cols-2 gap-2">
              <div>
                <label className="block text-xs font-bold text-stone-600 mb-1">日期</label>
                <input
                  type="date"
                  value={date}
                  onChange={e => setDate(e.target.value)}
                  className="w-full border border-stone-300 rounded-xl px-2.5 py-2 text-xs"
                />
              </div>
              <div>
                <label className="block text-xs font-bold text-stone-600 mb-1">時間</label>
                <input
                  type="time"
                  value={time}
                  onChange={e => setTime(e.target.value)}
                  className="w-full border border-stone-300 rounded-xl px-2.5 py-2 text-xs"
                />
              </div>
            </div>
          </div>

          <div>
            <label className="block text-xs font-bold text-stone-600 mb-1">詳細備註</label>
            <textarea
              rows={3}
              value={note}
              onChange={e => setNote(e.target.value)}
              placeholder="記低詳細情況，例如：用生理鹽水洗傷口、獎勵咗一條肉泥、便便形狀正常..."
              className="w-full border border-stone-300 rounded-xl p-3 text-xs"
            />
          </div>

          <button
            type="submit"
            className="w-full bg-amber-500 hover:bg-amber-600 active:scale-99 text-white font-extrabold py-3 rounded-xl text-sm shadow-md transition"
          >
            ✅ 儲存記錄
          </button>
        </form>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
